[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ogp"
version = "0.1.0"
description = "Reference implementation of Adaptive-OGP (NeurIPS 2026 submission, anonymous)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Anonymous Authors"},
]
keywords = [
    "continual-learning",
    "optimizer",
    "adam",
    "gradient-projection",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["adaptive_ogp*", "baselines*", "benchmarks*", "utils*"]
exclude = ["tests*", "experiments*", "figures*", "configs*", "scripts*", "runs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
